name: BioOS PNLF Liminal Persistence v0.1

on:
  push:
    branches:
      - feat/bioos-v0.4-liminal-persistence-v0.1
    paths:
      - 'tools/pnlf_persistence_v01.py'
      - 'tests/test_pnlf_persistence_v01.py'
      - 'spec/PNLF_LIMINAL_PERSISTENCE_V0_1.md'
      - 'provenance/PNLF_LOCAL_EXECUTABLE_EVIDENCE_AGGREGATE_V0_1.json'
      - '.github/workflows/pnlf-liminal-persistence-v01.yml'
  pull_request:
    paths:
      - 'tools/pnlf_persistence_v01.py'
      - 'tests/test_pnlf_persistence_v01.py'
      - 'spec/PNLF_LIMINAL_PERSISTENCE_V0_1.md'
      - 'provenance/PNLF_LOCAL_EXECUTABLE_EVIDENCE_AGGREGATE_V0_1.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_pnlf_persistence_v01.py
