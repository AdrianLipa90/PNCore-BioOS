name: BioOS GREMLIN Canon Binding v0.6

on:
  push:
    branches:
      - feat/bioos-v0.6-gremlin-canon-binding
  pull_request:
    paths:
      - 'tools/bioos_gremlin_canon_binding_v06.py'
      - 'tests/test_bioos_gremlin_canon_binding_v06.py'
      - 'spec/BIOOS_GREMLIN_CANON_BINDING_V0_6.md'
      - '.github/workflows/bioos-gremlin-canon-binding-v06.yml'

jobs:
  canon-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile canon binding
        run: python -m py_compile tools/bioos_gremlin_canon_binding_v06.py
      - name: Run v0.6 canon binding conformance
        run: python -m unittest -v tests.test_bioos_gremlin_canon_binding_v06
      - name: Run dependent v0.5 QHTRI gate IR regression
        run: python -m unittest -v tests.test_qhtri_m0_m11_gate_ir_v02 tests.test_qhtri_m0_m11_gate_ir_v01 tests.test_qhtri_m0_m11_gate_fabric_v01
