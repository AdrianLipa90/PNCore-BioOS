name: DN36 fundamental code v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bioos-dn36-fundamental-code-v0.1
    paths:
      - 'spec/DN36_FUNDAMENTAL_VECTOR_COMMIT_V0_1.md'
      - 'spec/DN36_DNCRYPT_AUX_BINDING_V0_1.md'
      - 'tools/dn36_fundamental_vector_commit_v01.py'
      - 'tools/dn36_dncrypt_aux_binding_v01.py'
      - 'tools/dn36_dncrypt_aux_conformance_v01.py'
      - 'tools/dn36_emit_c_constants_v01.py'
      - 'tools/dn36_native_parity_v01.py'
      - 'tools/benchmark/dn36_head_to_head_v01.py'
      - 'tools/benchmark/dn36_native_benchmark_v01.py'
      - 'native/dn36/**'
      - 'native/PNV_STATE_MEMORY_PAUX_DN36_DNCRYPT_PNSTORE_BIND_V0_1.pnv'
      - 'tests/test_dn36_fundamental_vector_commit_v01.py'
      - 'tests/test_dn36_dncrypt_aux_binding_v01.py'
      - '.github/workflows/dn36-fundamental-code-v01.yml'
  pull_request:
    paths:
      - 'spec/DN36_FUNDAMENTAL_VECTOR_COMMIT_V0_1.md'
      - 'spec/DN36_DNCRYPT_AUX_BINDING_V0_1.md'
      - 'tools/dn36_fundamental_vector_commit_v01.py'
      - 'tools/dn36_dncrypt_aux_binding_v01.py'
      - 'tools/dn36_dncrypt_aux_conformance_v01.py'
      - 'tools/dn36_emit_c_constants_v01.py'
      - 'tools/dn36_native_parity_v01.py'
      - 'tools/benchmark/dn36_head_to_head_v01.py'
      - 'tools/benchmark/dn36_native_benchmark_v01.py'
      - 'native/dn36/**'
      - 'native/PNV_STATE_MEMORY_PAUX_DN36_DNCRYPT_PNSTORE_BIND_V0_1.pnv'
      - 'tests/test_dn36_fundamental_vector_commit_v01.py'
      - 'tests/test_dn36_dncrypt_aux_binding_v01.py'
      - '.github/workflows/dn36-fundamental-code-v01.yml'

jobs:
  dn36-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: DN36 conformance and auxiliary DNCrypt fail-closed gates
        run: python -m pytest -q tests/test_dn36_fundamental_vector_commit_v01.py tests/test_dn36_dncrypt_aux_binding_v01.py
      - name: DN36 DNCrypt auxiliary conformance receipt
        run: python -m tools.dn36_dncrypt_aux_conformance_v01
      - name: Generate pinned native constant profile
        run: python -m tools.dn36_emit_c_constants_v01 --out build/dn36/dn36_generated_constants_v01.h
      - name: Compile scalar native DN36
        run: gcc -O3 -std=c11 -Wall -Wextra -Werror -Ibuild/dn36 -Inative/dn36 native/dn36/dn36_v01.c native/dn36/dn36_cli_v01.c -o build/dn36/dn36_native_v01
      - name: Exact Python to scalar C parity gate
        run: python -m tools.dn36_native_parity_v01 build/dn36/dn36_native_v01
      - name: Measured DN36 vs standard hash reference
        run: python -m tools.benchmark.dn36_head_to_head_v01
      - name: Measured scalar native DN36 benchmark
        run: python -m tools.benchmark.dn36_native_benchmark_v01 build/dn36/dn36_native_v01
      - name: Upload DN36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn36-fundamental-code-v01-evidence
          path: |
            build/dn36/BIOOS_DN36_DNCRYPT_AUX_CONFORMANCE_V0_1.json
            build/dn36/BIOOS_DN36_NATIVE_PARITY_V0_1.json
            build/dn36/BIOOS_DN36_HEAD_TO_HEAD_V0_1.json
            build/dn36/BIOOS_DN36_NATIVE_SCALAR_BENCH_V0_1.json
          if-no-files-found: warn
