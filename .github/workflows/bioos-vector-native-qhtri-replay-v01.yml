name: BioOS Vector-Native QHTRI Replay v0.1

on:
  push:
    branches:
      - feat/bioos-vector-native-exec-loop-v0.1
  pull_request:
    paths:
      - 'arch/x86_64/pncore/vector_native_qhtri_replay_entry.S'
      - 'arch/x86_64/pncore/vector_native_qhtri_replay_template.S'
      - 'tools/vector_native_qhtri_replay_v01.py'
      - 'tools/qemu_vector_native_qhtri_build_v01.py'
      - 'tools/qemu_vector_native_qhtri_conformance_v01.py'
      - 'tools/qemu_vector_native_qhtri_adversarial_v01.py'
      - 'tests/test_vector_native_qhtri_replay_v01.py'
      - 'provenance/BIOOS_VECTOR_NATIVE_QHTRI_SOURCE_V0_1.json'
      - 'provenance/BIOOS_VECTOR_NATIVE_QHTRI_REPLAY_V0_1.json'
      - '.github/workflows/bioos-vector-native-qhtri-replay-v01.yml'

jobs:
  vector-native-qhtri-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Run fail-closed replay unit surface
        run: python -m pytest -q tests/test_vector_native_qhtri_replay_v01.py

      - name: Build exact source-bound BioOS replay ROM
        run: python tools/qemu_vector_native_qhtri_build_v01.py .

      - name: Execute exact replay under QEMU TCG
        run: python tools/qemu_vector_native_qhtri_conformance_v01.py . --timeout 3

      - name: Execute adversarial replay fail-closed gate
        run: python tools/qemu_vector_native_qhtri_adversarial_v01.py . --timeout 2

      - name: Upload vector-native replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioos-vector-native-qhtri-replay-v01-evidence
          path: |
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_QEMU_BUILD_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_QEMU_CONFORMANCE_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_QEMU_ADVERSARIAL_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_PNVH_RECEIPT_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_CODE_BINDING_RECEIPT_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_PNR_T36_RECEIPT_V0_1.json
            provenance/BIOOS_VECTOR_NATIVE_QHTRI_T36_RECEIPT_V0_1.json
            build/x86_64/bioos_vector_native_qhtri_qemu.bin
