name: BioOS GREMLIN Neutrino Canon Binding v0.6

on:
  push:
    branches:
      - feat/bioos-v0.6-gremlin-canon-binding
  pull_request:
    paths:
      - 'tools/bioos_gremlin_neutrino_canon_binding_v06.py'
      - 'tests/test_bioos_gremlin_neutrino_canon_binding_v06.py'
      - 'spec/BIOOS_GREMLIN_NEUTRINO_CANON_BINDING_V0_6.md'
      - '.github/workflows/bioos-gremlin-neutrino-canon-binding-v06.yml'

jobs:
  canon-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile BioOS canon binding
        run: python -m py_compile tools/bioos_gremlin_neutrino_canon_binding_v06.py tests/test_bioos_gremlin_neutrino_canon_binding_v06.py
      - name: Run BioOS canon binding conformance
        run: python -m unittest -v tests.test_bioos_gremlin_neutrino_canon_binding_v06
